version: "3.9"

networks:
  foro-net:
    driver: bridge

services:
  # ---------- Microservicio: control de sesión ----------
  micro-sesion:
    image: ${ECR_REGISTRY}/micro-control-sesion:${IMAGE_TAG:-latest}
    container_name: micro-sesion
    restart: unless-stopped
    networks: [foro-net]
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_SESION_USERNAME}
      DB_PASSWORD: ${DB_SESION_PASSWORD}
      TNS_ADMIN: /app/wallet
    volumes:
      - /opt/foro/wallet:/app/wallet:ro

  # ---------- Microservicio: temas del foro ----------
  micro-temas:
    image: ${ECR_REGISTRY}/micro-temas-foro:${IMAGE_TAG:-latest}
    container_name: micro-temas
    restart: unless-stopped
    networks: [foro-net]
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_TEMAS_USERNAME}
      DB_PASSWORD: ${DB_TEMAS_PASSWORD}
      TNS_ADMIN: /app/wallet
      # Si micro-temas llama a micro-sesion por HTTP interno:
      SESION_URL: http://micro-sesion:8080
    volumes:
      - /opt/foro/wallet:/app/wallet:ro
    depends_on:
      - micro-sesion

  # ---------- Microservicio: moderación ----------
  micro-moderacion:
    image: ${ECR_REGISTRY}/micro-moderacion:${IMAGE_TAG:-latest}
    container_name: micro-moderacion
    restart: unless-stopped
    networks: [foro-net]
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_MODERACION_USERNAME}
      DB_PASSWORD: ${DB_MODERACION_PASSWORD}
      TNS_ADMIN: /app/wallet
      SESION_URL: http://micro-sesion:8080
      TEMAS_URL: http://micro-temas:8080
    volumes:
      - /opt/foro/wallet:/app/wallet:ro
    depends_on:
      - micro-sesion
      - micro-temas

  # ---------- Frontend Angular ----------
  front:
    image: ${ECR_REGISTRY}/front-angular-foro:${IMAGE_TAG:-latest}
    container_name: front
    restart: unless-stopped
    networks: [foro-net]
    ports:
      - "4200:80"     # Nginx interno del contenedor sirve en :80
    depends_on:
      - micro-sesion
      - micro-temas
      - micro-moderacion